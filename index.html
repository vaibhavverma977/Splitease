<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>SplitEase · Expense Sharing</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- ===== APP SHELL ===== -->
    <div id="app">

        <!-- ===== HOME VIEW ===== -->
        <section id="home-view" class="view active">
            <header class="app-header">
                <div class="header-left">
                    <span class="app-icon">⟡</span>
                    <h1 class="app-title">SplitEase</h1>
                </div>
                <span class="header-sub">share fairly</span>
            </header>

            <!-- Status Toggle -->
            <div class="status-toggle-bar">
                <button id="status-open" class="status-btn active" data-status="open">OPEN</button>
                <button id="status-history" class="status-btn" data-status="settled">HISTORY</button>
            </div>

            <div class="home-content">
                <div id="groups-list" class="groups-list">
                    <!-- Groups rendered here by JS -->
                </div>
                <div id="empty-state" class="empty-state">
                    <div class="empty-icon">📂</div>
                    <h3 id="empty-title">No active trips yet</h3>
                    <p id="empty-desc">Create your first group to start splitting expenses.</p>
                </div>
            </div>

            <button id="btn-create-group" class="fab" aria-label="Create group">
                <span class="fab-icon">+</span>
            </button>
        </section>

        <!-- ===== GROUP DETAIL VIEW ===== -->
        <section id="group-view" class="view">
            <header class="group-header">
                <button id="btn-back" class="back-btn" aria-label="Back to groups">
                    <span class="back-arrow">‹</span>
                </button>
                <div class="group-title-wrapper">
                    <h2 id="group-title" class="group-title">Group</h2>
                    <button id="btn-rename-group" class="rename-btn" aria-label="Rename group">✎</button>
                </div>
                <button id="btn-delete-group" class="delete-group-btn" aria-label="Delete group">
                    <span class="delete-icon">✕</span>
                </button>
            </header>

            <!-- Group Status Action -->
            <div id="group-status-action" class="group-status-action">
                <!-- Rendered by JS: "Mark Trip as Settled" or "Reopen Trip" -->
            </div>

            <!-- Tab Bar -->
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="members">Members</button>
                <button class="tab-btn" data-tab="expenses">Expenses</button>
                <button class="tab-btn" data-tab="overview">Overview</button>
                <button class="tab-btn" data-tab="balances">Balances</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content">

                <!-- MEMBERS TAB -->
                <div id="tab-members" class="tab-panel active">
                    <div class="members-section">
                        <div class="members-list" id="members-list">
                            <!-- Rendered by JS -->
                        </div>
                        <div class="add-member-row">
                            <input type="text" id="input-member-name" placeholder="Add member name…" maxlength="30" />
                            <button id="btn-add-member" class="btn-add-member">Add</button>
                        </div>
                        <p id="member-error" class="form-error hidden"></p>
                    </div>
                </div>

                <!-- EXPENSES TAB -->
                <div id="tab-expenses" class="tab-panel">
                    <div class="expenses-section">
                        <div id="expenses-list" class="expenses-list">
                            <!-- Rendered by JS -->
                        </div>
                        <div id="expense-empty" class="empty-state small">
                            <span class="empty-icon">🧾</span>
                            <p>No expenses yet. Add one below.</p>
                        </div>
                        <button id="btn-add-expense" class="btn-add-expense">+ Add Expense</button>
                    </div>
                </div>

                <!-- OVERVIEW TAB -->
                <div id="tab-overview" class="tab-panel">
                    <div class="overview-section">
                        <div class="overview-total">
                            <span class="total-label">Total Trip Spending</span>
                            <span id="total-spending" class="total-amount">₹0.00</span>
                        </div>
                        <div class="chart-container">
                            <div id="pie-chart" class="pie-chart">
                                <!-- SVG will be rendered here -->
                            </div>
                            <div id="chart-legend" class="chart-legend">
                                <!-- Legend rendered by JS -->
                            </div>
                        </div>
                        <div id="member-breakdown" class="member-breakdown">
                            <!-- Breakdown list rendered by JS -->
                        </div>
                        <div id="overview-empty" class="empty-state small">
                            <span class="empty-icon">📊</span>
                            <p>No expenses yet. Add expenses to see the spending overview.</p>
                        </div>
                    </div>
                </div>

                <!-- BALANCES TAB -->
                <div id="tab-balances" class="tab-panel">
                    <div class="balances-section">
                        <div id="balances-summary" class="balances-summary">
                            <!-- Rendered by JS -->
                        </div>
                        <div id="settlement-section" class="settlement-section">
                            <h4>Settlement</h4>
                            <div id="settlement-list" class="settlement-list">
                                <!-- Rendered by JS -->
                            </div>
                        </div>
                    </div>
                </div>

            </div><!-- /tab-content -->
        </section>

        <!-- ===== MODALS ===== -->

        <!-- Create Group Modal -->
        <div id="modal-create-group" class="modal-overlay">
            <div class="modal-sheet">
                <div class="modal-header">
                    <h3>New Group</h3>
                    <button class="modal-close" data-close="modal-create-group">✕</button>
                </div>
                <div class="modal-body">
                    <label for="input-group-name">Group Name</label>
                    <input type="text" id="input-group-name" placeholder="e.g. Weekend Trip" maxlength="40" />
                    <p id="group-name-error" class="form-error hidden"></p>
                    <button id="btn-confirm-group" class="btn-primary">Create Group</button>
                </div>
            </div>
        </div>

        <!-- Add / Edit Expense Modal -->
        <div id="modal-add-expense" class="modal-overlay">
            <div class="modal-sheet">
                <div class="modal-header">
                    <h3 id="expense-modal-title">Add Expense</h3>
                    <button class="modal-close" data-close="modal-add-expense">✕</button>
                </div>
                <div class="modal-body">
                    <label for="input-expense-desc">Description</label>
                    <input type="text" id="input-expense-desc" placeholder="e.g. Dinner" maxlength="50" />

                    <label for="input-expense-amount">Amount (₹)</label>
                    <input type="number" id="input-expense-amount" placeholder="0.00" min="0.01" step="0.01" />

                    <label for="input-expense-date">Date</label>
                    <input type="date" id="input-expense-date" />

                    <label for="input-expense-payer">Paid by</label>
                    <select id="input-expense-payer"></select>

                    <label class="label-inline">Included people</label>
                    <div id="expense-included-list" class="checkbox-group">
                        <!-- Rendered by JS -->
                    </div>

                    <!-- Split Type Selector -->
                    <label for="input-split-type">Split type</label>
                    <select id="input-split-type">
                        <option value="equal">Equal</option>
                        <option value="percentage">Percentage</option>
                        <option value="custom">Custom Amount</option>
                    </select>

                    <!-- Dynamic split inputs container -->
                    <div id="split-inputs-container" class="split-inputs-container">
                        <!-- Rendered by JS based on split type and included members -->
                    </div>

                    <label for="input-expense-notes">Notes (optional)</label>
                    <textarea id="input-expense-notes" placeholder="Add any extra details…" rows="2"></textarea>

                    <div id="split-error" class="form-error hidden"></div>
                    <div id="split-info" class="split-info hidden"></div>

                    <button id="btn-confirm-expense" class="btn-primary">Add Expense</button>
                </div>
            </div>
        </div>

    </div><!-- /app -->

    <script src="app.js"></script>
</body>
</html>
